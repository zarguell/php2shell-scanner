# TLS-appliance nginx config: nginx TLS (self-signed, generated at test time
# by tests/lab/gen-tls-cert.sh) -> php-fpm 8.5.11 backend. No PHP headers added
# by the proxy (like a :8443 management UI).
upstream php_backend {
    server tls-backend:9000;
}
server {
    listen 443 ssl;
    server_tokens off;
    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    root /var/www/html;
    index index.php index.html;
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ \.php$ {
        fastcgi_pass php_backend;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        include fastcgi_params;
    }
}
