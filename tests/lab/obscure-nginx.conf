# Obscure-path FPM nginx config for the silent-obscure lab demo.
# Differences from fpm-nginx.conf (deliberate):
#  - NO `location ~ \.php$` block: only /api/submit is routed to PHP-FPM.
#    Every PHP_PATH_CANDIDATES guess (/app.php, /search.php, /index.php, ...)
#    and every APP_PROBES/DEPLOY_PROBES path 404s at nginx and NEVER REACHES
#    PHP. The safe probes genuinely go blind here by construction.
#  - 404s served by nginx identically for .php/.txt/extensionless, so the
#    404-differential stays negative too.
#  - display_errors=Off + expose_php=Off on the backend: even the one live
#    PHP path leaks zero bytes of identity.
#  - client_max_body_size raised (default 1m) so the lab-only OOM demo in
#    tests/lab/unsafe_probe_demo.py reaches PHP instead of nginx's 413.
upstream php_backend {
    server obscure-backend:9000;
}
server {
    listen 80;
    server_tokens off;
    client_max_body_size 50m;
    root /var/www/html;
    location / {
        try_files $uri $uri/ =404;
    }
    # single obscure write endpoint -> PHP-FPM; nothing else reaches PHP
    location = /api/submit {
        fastcgi_pass php_backend;
        fastcgi_param SCRIPT_FILENAME /var/www/html/api/submit.php;
        include fastcgi_params;
    }
}
