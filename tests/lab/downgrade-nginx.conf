# Downgrade-stub nginx config: plain HTTP 301 -> https://127.0.0.1:19098/
# (the TLS appliance). Proves the scanner scans BEHIND the stub instead of
# fingerprinting the 301 page. Lab-only.
server {
    listen 80;
    server_tokens off;
    location / {
        return 301 https://127.0.0.1:19098$request_uri;
    }
}
