version: "3.8"
# php2shell scanner test lab — localhost published ports for the test runner.
# Lab-only. Never expose publicly.
services:
  vuln-error-on:
    image: php:8.5.11-apache
    ports: ["19081:80"]
    command: >
      bash -c "echo 'display_errors=On\nlog_errors=Off\nexpose_php=On\nsession.upload_progress.enabled=1' > /usr/local/etc/php/conf.d/zz-lab.ini
      && printf '<?php echo \"lab-ok \"; echo phpversion();' > /var/www/html/index.php
      && docker-php-entrypoint apache2-foreground"
  vuln-error-off:
    image: php:8.5.11-apache
    ports: ["19082:80"]
    command: >
      bash -c "echo 'display_errors=Off\nlog_errors=Off\nexpose_php=Off\nsession.upload_progress.enabled=1' > /usr/local/etc/php/conf.d/zz-lab.ini
      && printf '<?php echo \"lab-ok\";' > /var/www/html/app.php
      && rm -f /var/www/html/index.php
      && printf '<html><body>welcome</body></html>' > /var/www/html/index.html
      && docker-php-entrypoint apache2-foreground"
  patched:
    image: php:8.5-apache
    ports: ["19083:80"]
    command: >
      bash -c "echo 'display_errors=On\nlog_errors=Off\nexpose_php=On\nsession.upload_progress.enabled=1' > /usr/local/etc/php/conf.d/zz-lab.ini
      && printf '<?php echo \"lab-ok \"; echo phpversion();' > /var/www/html/index.php
      && docker-php-entrypoint apache2-foreground"
  eol-old:
    image: php:8.3.6-apache
    ports: ["19084:80"]
    command: >
      bash -c "echo 'display_errors=On\nexpose_php=On' > /usr/local/etc/php/conf.d/zz-lab.ini
      && printf '<?php echo \"lab-ok \"; echo phpversion();' > /var/www/html/index.php
      && docker-php-entrypoint apache2-foreground"
  notphp:
    image: nginx:alpine
    ports: ["19085:80"]
  static-only:
    image: php:8.5.11-apache
    ports: ["19086:80"]
    command: >
      bash -c "printf '<html><body>static</body></html>' > /var/www/html/index.html
      && rm -f /var/www/html/index.php
      && docker-php-entrypoint apache2-foreground"
  upload-disabled:
    image: php:8.5.11-apache
    ports: ["19087:80"]
    command: >
      bash -c "echo 'display_errors=On\nlog_errors=Off\nexpose_php=On\nsession.upload_progress.enabled=0' > /usr/local/etc/php/conf.d/zz-lab.ini
      && printf '<?php echo \"lab-ok \"; echo phpversion();' > /var/www/html/index.php
      && docker-php-entrypoint apache2-foreground"
  # VAGUE: vuln PHP 8.5.11, X-Powered-By stripped but errors ON at the PHP
  # layer (the realistic partial-hardening case: header hidden, warnings leak).
  # Front page is static-looking; PHP hides at /app.php + /search.php.
  vague-hardened:
    image: php:8.5.11-apache
    ports: ["19088:80"]
    command: >
      bash -c "echo 'display_errors=On\nlog_errors=Off\nexpose_php=Off\nsession.upload_progress.enabled=1' > /usr/local/etc/php/conf.d/zz-lab.ini
      && printf '<html><head><title>Dashboard</title></head><body><h1>Welcome</h1></body></html>' > /var/www/html/index.html
      && rm -f /var/www/html/index.php
      && printf '<?php /* internal tool v2.3 */ echo \"tool home\";' > /var/www/html/app.php
      && printf '<?php $$q = $$_GET[\"q\"] ?? \"\"; echo \"search:\" . htmlspecialchars($$q);' > /var/www/html/search.php
      && docker-php-entrypoint apache2-foreground"
  # WORDPRESS on vulnerable PHP 8.3.6 (WP needs no DB to serve wp-login.php).
  # expone_php off + errors off: headers won't say PHP, app probes must fire.
  wordpress-vuln:
    image: wordpress:php8.2-apache
    ports: ["19089:80"]
    environment:
      WORDPRESS_DB_HOST: "none:3306"
    command: >
      bash -c "echo 'display_errors=Off\nlog_errors=Off\nexpose_php=Off' > /usr/local/etc/php/conf.d/zz-lab.ini
      && docker-entrypoint.sh apache2-foreground"
  # PHPMYADMIN on stock PHP (patched 8.3.36 build) — app fingerprint check.
  pma:
    image: phpmyadmin:5.2
    ports: ["19090:80"]
    environment:
      PMA_HOST: "none"
  # SILENT: vuln 8.5.11, errors OFF + headers stripped, dynamic PHP at
  # /search.php. Oracle blind; version hidden. The CANNOT_RULE_OUT case:
  # 404-differential + discovered-path evidence must still surface it.
  silent-errors-off:
    image: php:8.5.11-apache
    ports: ["19091:80"]
    command: >
      bash -c "echo 'display_errors=Off\nlog_errors=Off\nexpose_php=Off\nsession.upload_progress.enabled=1\nServerTokens Prod\nServerSignature Off' > /usr/local/etc/php/conf.d/zz-lab.ini
      && printf '<html><head><title>Portal</title></head><body><h1>Portal</h1></body></html>' > /var/www/html/index.html
      && rm -f /var/www/html/index.php
      && printf '<?php $$q = $$_GET[\"q\"] ?? \"\"; echo \"results for:\" . htmlspecialchars($$q);' > /var/www/html/search.php
      && docker-php-entrypoint apache2-foreground"
  # FPM: vuln 8.5.11 via php-fpm + nginx proxy (no PHP headers by default).
  # CVE-2026-109619's stale-state path is FPM-relevant; scanner must at least
  # attribute PHP and try the oracle through the proxy.
  fpm-backend:
    image: php:8.5.11-fpm
    command: >
      bash -c "echo 'display_errors=On\nlog_errors=Off\nexpose_php=On\nsession.upload_progress.enabled=1' > /usr/local/etc/php/conf.d/zz-lab.ini
      && printf '<?php echo \"fpm-ok \"; echo phpversion();' > /var/www/html/index.php
      && php-fpm"
  fpm-front:
    image: nginx:alpine
    ports: ["19092:80"]
    volumes:
      - ./fpm-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - fpm-backend
  # SILENT-OBSCURE (limits demo): vuln 8.5.11 FPM, errors OFF, headers
  # stripped, PHP reachable ONLY at /api/submit (no .php location block, so
  # every candidate/app/deploy guess 404s at nginx; 404-differential stays
  # negative). Safe probes go fully blind BY CONSTRUCTION — the documented
  # case where only an unsafe OOM probe or --local can answer.
  obscure-backend:
    image: php:8.5.11-fpm
    command: >
      bash -c "echo 'display_errors=Off\nlog_errors=Off\nexpose_php=Off\nsession.upload_progress.enabled=1\nmemory_limit=64M' > /usr/local/etc/php/conf.d/zz-lab.ini
      && mkdir -p /var/www/html/api
      && printf '<?php http_response_code(200); echo \"ok\";' > /var/www/html/api/submit.php
      && printf '<html><head><title>Service</title></head><body>service</body></html>' > /var/www/html/index.html
      && php-fpm"
  obscure-front:
    image: nginx:alpine
    ports: ["19093:80"]
    volumes:
      - ./obscure-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - obscure-backend
  # Patched control for the obscure pair: identical routing/shape, PHP 8.5.12.
  obscure-fixed-backend:
    image: php:8.5-fpm
    command: >
      bash -c "echo 'display_errors=Off\nlog_errors=Off\nexpose_php=Off\nsession.upload_progress.enabled=1\nmemory_limit=64M' > /usr/local/etc/php/conf.d/zz-lab.ini
      && mkdir -p /var/www/html/api
      && printf '<?php http_response_code(200); echo \"ok\";' > /var/www/html/api/submit.php
      && printf '<html><head><title>Service</title></head><body>service</body></html>' > /var/www/html/index.html
      && php-fpm"
  obscure-fixed-front:
    image: nginx:alpine
    ports: ["19094:80"]
    volumes:
      - ./obscure-nginx-fixed.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - obscure-fixed-backend
  # APPLIANCE twins: locked-down "vendor panel" UIs on vuln 8.5.11 vs patched
  # 8.5.12. No Server header (headers stripped at app layer via header_remove
  # + .htaccess), errors off, expose_php off — but the panel login pages and
  # panel build strings leak (as real Plesk/cPanel/PAN-OS UIs do). The scanner
  # must attribute the PHP-backed panel WITHOUT a PHP version header.
  appliance-vuln:
    image: php:8.5.11-apache
    ports: ["19095:80"]
    command: >
      bash -c "echo 'display_errors=Off\nlog_errors=Off\nexpose_php=Off\nsession.upload_progress.enabled=1' > /usr/local/etc/php/conf.d/zz-lab.ini
      && a2enmod headers
      && printf 'Header unset X-Powered-By\nHeader unset Server\nServerTokens Prod\nServerSignature Off' > /etc/apache2/conf-enabled/zz-headers.conf
      && rm -f /var/www/html/index.php
      && printf '<html><head><title>Plesk Obsidian 18.0.70 Login</title></head><body><div class=\"psa-page\"><form action=\"login.php\">Plesk sw-cp-server login</form></div></body></html>' > /var/www/html/index.html
      && printf '<html><head><title>Plesk Obsidian 18.0.70</title></head><body><div class=\"psa-page\">Plesk sw-cp-server login page</div></body></html>' > /var/www/html/login.php
      && docker-php-entrypoint apache2-foreground"
  appliance-fixed:
    image: php:8.5-apache
    ports: ["19096:80"]
    command: >
      bash -c "echo 'display_errors=Off\nlog_errors=Off\nexpose_php=Off\nsession.upload_progress.enabled=1' > /usr/local/etc/php/conf.d/zz-lab.ini
      && a2enmod headers
      && printf 'Header unset X-Powered-By\nHeader unset Server\nServerTokens Prod\nServerSignature Off' > /etc/apache2/conf-enabled/zz-headers.conf
      && rm -f /var/www/html/index.php
      && printf '<html><head><title>Plesk Obsidian 18.0.81 Login</title></head><body><div class=\"psa-page\"><form action=\"login.php\">Plesk sw-cp-server login</form></div></body></html>' > /var/www/html/index.html
      && printf '<html><head><title>Plesk Obsidian 18.0.81</title></head><body><div class=\"psa-page\">Plesk sw-cp-server login page</div></body></html>' > /var/www/html/login.php
      && docker-php-entrypoint apache2-foreground"
  # DEEP-SURFACE (spider demo): vuln 8.5.11, errors ON, headers stripped. The
  # front page is static and links only to static pages; the PHP lives TWO
  # CLICKS down (/docs -> /portal/home.php, dynamic ?q handler). Single-page
  # harvest sees nothing; the bounded spider must find /portal/home.php and
  # the oracle must fire there. None of the static guess paths hit.
  deep-surface:
    image: php:8.5.11-apache
    ports: ["19097:80"]
    command: >
      bash -c "echo 'display_errors=On\nlog_errors=Off\nexpose_php=Off\nsession.upload_progress.enabled=1' > /usr/local/etc/php/conf.d/zz-lab.ini
      && rm -f /var/www/html/index.php
      && printf '<html><head><title>Acme Corp</title></head><body><nav><a href=\"/about\">About</a><a href=\"/docs\">Docs</a></nav><h1>Welcome</h1></body></html>' > /var/www/html/index.html
      && printf '<html><head><title>About</title></head><body><h1>About Acme</h1></body></html>' > /var/www/html/about
      && printf '<html><head><title>Docs</title></head><body><h1>Docs</h1><a href=\"/portal/\">Customer portal</a></body></html>' > /var/www/html/docs
      && mkdir -p /var/www/html/portal
      && printf '<html><head><title>Portal</title></head><body><h1>Portal</h1><a href=\"/portal/home.php\">Enter</a></body></html>' > /var/www/html/portal/index.html
      && printf '<?php $$q = $$_GET[\"q\"] ?? \"\"; echo \"portal-home:\" . htmlspecialchars($$q);' > /var/www/html/portal/home.php
      && docker-php-entrypoint apache2-foreground"
  # TLS-APPLIANCE: vuln 8.5.11 behind nginx TLS on non-standard port (like a
  # :8443 management UI), self-signed cert, errors ON. Proves both-scheme
  # probing + --insecure path: strict verification sees TLS but untrusted.
  tls-backend:
    image: php:8.5.11-fpm
    command: >
      bash -c "echo 'display_errors=On\nlog_errors=Off\nexpose_php=On\nsession.upload_progress.enabled=1' > /usr/local/etc/php/conf.d/zz-lab.ini
      && printf '<?php echo \"tls-ok \"; echo phpversion();' > /var/www/html/index.php
      && php-fpm"
  tls-front:
    image: nginx:alpine
    ports: ["19098:443"]
    volumes:
      - ./tls-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-cert:/etc/nginx/tls:ro
    depends_on:
      - tls-backend
  # DOWNGRADE stub: plain HTTP on :19099 redirects to the TLS appliance
  # (:19098) — proves the scanner follows the upgrade and scans BEHIND the
  # stub instead of fingerprinting the 301 page. No local service needed;
  # covered by the redirect_to unit test + live 19098 TLS tests.
  downgrade-stub:
    image: nginx:alpine
    ports: ["19099:80"]
    volumes:
      - ./downgrade-nginx.conf:/etc/nginx/conf.d/default.conf:ro
  # JS-SPA: vuln 8.5.11, errors ON, headers stripped. index.html has ZERO
  # .php references — all endpoints live in /static/app.js (fetch +
  # dynamic import). Single-page harvest AND plain-HTML spider are blind;
  # only JS-bundle fetching finds /api/v2/endpoint.php + /portal/deep.php.
  js-spa:
    image: php:8.5.11-apache
    ports: ["19100:80"]
    volumes:
      - ./js-spa/index.html:/var/www/html/index.html:ro
      - ./js-spa/app.js:/var/www/html/static/app.js:ro
    command: >
      bash -c "echo 'display_errors=On\nlog_errors=Off\nexpose_php=Off\nsession.upload_progress.enabled=1' > /usr/local/etc/php/conf.d/zz-lab.ini
      && mkdir -p /var/www/html/api/v2 /var/www/html/portal
      && printf '<?php $$a = $$_GET[\"action\"] ?? \"\"; echo \"api:\" . htmlspecialchars($$a);' > /var/www/html/api/v2/endpoint.php
      && printf '<?php echo \"deep-ok\";' > /var/www/html/portal/deep.php
      && docker-php-entrypoint apache2-foreground"
  # JS-DYN (StringTable demo): vuln 8.5.11, errors ON, headers stripped.
  # index.html loads /static/loader.js; the loader pulls
  # jsAd/StringTable_<lang> + ".js" AT RUNTIME (no static .js ref to it).
  # The StringTable embeds server-side PHP names ($this->, $_SESSION).
  # Only bundle-recursion finds it: HTML -> loader.js -> StringTable_en.js.
  js-dyn:
    image: php:8.5.11-apache
    ports: ["19101:80"]
    volumes:
      - ./js-dyn/index.html:/var/www/html/index.html:ro
      - ./js-dyn/loader.js:/var/www/html/static/loader.js:ro
      - ./js-dyn/stringtable/en.js:/var/www/html/jsAd/StringTable_en.js:ro
    command: >
      bash -c "echo 'display_errors=On\nlog_errors=Off\nexpose_php=Off\nsession.upload_progress.enabled=1' > /usr/local/etc/php/conf.d/zz-lab.ini
      && mkdir -p /var/www/html/api
      && printf '<?php $$a = $$_GET[\"action\"] ?? \"\"; echo \"dynapi:\" . htmlspecialchars($$a);' > /var/www/html/api/dyn.php
      && docker-php-entrypoint apache2-foreground"
